name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: nothing in CI needs to write to the repository.
permissions:
  contents: read

# One run per PR at a time: pushing again cancels the PR's run still in progress. Runs on main are
# never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --project tests/Hlibz.TypeRules.Analyzers.Tests --no-build --configuration Release

      # The sample loads the analyzer from a real .editorconfig. It built clean above; with its
      # violations compiled in, it must report exactly Violations/expected-diagnostics.txt.
      - name: Sample reports exactly the expected violations
        run: samples/Hlibz.TypeRules.Analyzers.Sample/verify-violations.sh Release

      - name: Pack
        run: dotnet pack src/Hlibz.TypeRules.Analyzers.Package --no-build --configuration Release --output ./artifacts

      # Both analyzer assemblies, and the README and icon nuget.org shows: at the package root and
      # referenced by the nuspec, since dropping PackageIcon or PackageReadmeFile still packs.
      - name: Package contents
        run: |
          unzip -l ./artifacts/*.nupkg > contents.txt
          cat contents.txt
          grep -q "analyzers/dotnet/cs/Hlibz.TypeRules.Analyzers.dll" contents.txt
          grep -q "analyzers/dotnet/cs/Hlibz.TypeRules.Analyzers.CodeFixes.dll" contents.txt
          grep -qE " README\.md$" contents.txt
          grep -qE " icon\.png$" contents.txt
          unzip -p ./artifacts/*.nupkg '*.nuspec' > package.nuspec
          grep -q "<readme>README.md</readme>" package.nuspec
          grep -q "<icon>icon.png</icon>" package.nuspec

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ./artifacts/*.nupkg

  # The analyzers compile against Roslyn 4.8, so the .NET 8 SDK is the oldest compiler that can
  # load them. Runs the packed DLLs there, in the sample built for net8.0: it must build clean,
  # and with its violations report exactly the expected diagnostics.
  oldest-sdk:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        id: setup
        with:
          dotnet-version: 8.0.x

      # The runner image also has newer SDKs, which dotnet would otherwise pick.
      - name: Pin the .NET 8 SDK
        run: |
          dotnet new globaljson --sdk-version "${{ steps.setup.outputs.dotnet-version }}" --force
          dotnet --version

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ./artifacts

      - name: Extract the analyzers
        run: unzip -q ./artifacts/*.nupkg 'analyzers/*' -d ./package

      - name: Sample builds clean
        run: >
          dotnet build samples/Hlibz.TypeRules.Analyzers.Sample
          --configuration Release
          -p:SampleTargetFramework=net8.0
          -p:TypeRulesAnalyzerPath="$PWD/package/analyzers/dotnet/cs"

      - name: Sample reports exactly the expected violations
        run: >
          samples/Hlibz.TypeRules.Analyzers.Sample/verify-violations.sh Release
          -p:SampleTargetFramework=net8.0
          -p:TypeRulesAnalyzerPath="$PWD/package/analyzers/dotnet/cs"
